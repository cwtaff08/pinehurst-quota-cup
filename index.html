<style>
:root{
  --bg:#EEF0E6; --surface:#F8F9F3; --ink:#14251C; --muted:#586A5D; --line:#CFD6C6;
  --board:#1F3A2B; --on-board:#F1F4EA; --on-board-muted:#A9BCAF; --board-line:rgba(255,255,255,.14);
  --sand:#D8C994; --pos:#1E7444; --neg:#A93529; --gold:#8F6B0B;
  --pos-b:#7FD6A0; --neg-b:#F19A8B;
  --sel-bg:#1F3A2B; --sel-ink:#F1F4EA; --focus:#1D5FA7;
  --num:'Barlow Condensed','Arial Narrow','Roboto Condensed',sans-serif;
  --txt:'Newsreader',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1913; --surface:#15251C; --ink:#E7EDE2; --muted:#93A69A; --line:#284034;
    --board:#1E3A2A; --on-board:#F1F4EA; --on-board-muted:#A9BCAF;
    --sand:#D8C994; --pos:#63C48A; --neg:#F08C7C; --gold:#D4AE45;
    --sel-bg:#D8C994; --sel-ink:#12200F; --focus:#7DB5F0;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1913; --surface:#15251C; --ink:#E7EDE2; --muted:#93A69A; --line:#284034;
  --board:#1E3A2A; --on-board:#F1F4EA; --on-board-muted:#A9BCAF;
  --sand:#D8C994; --pos:#63C48A; --neg:#F08C7C; --gold:#D4AE45;
  --sel-bg:#D8C994; --sel-ink:#12200F; --focus:#7DB5F0;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 var(--txt);padding-bottom:88px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.num{font-family:var(--num);font-variant-numeric:tabular-nums lining-nums}
.muted{color:var(--muted)}
.sm{font-size:14px}
.wrap{max-width:640px;margin:0 auto;padding:0 14px}
.mast{max-width:640px;margin:0 auto;padding:16px 16px 4px;display:flex;align-items:center;gap:12px}
.mast .mark{width:40px;height:auto;flex:0 0 auto}
.mast h1{margin:0;font:700 32px/1 var(--num);letter-spacing:.01em}
.mast p{margin:5px 0 0;color:var(--muted);font-size:15px}

/* round strip */
.trip{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0 14px}
.rchip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 2px 6px;text-align:center;line-height:1.15;min-height:58px}
.rchip .rn{display:block;font:700 16px/1 var(--num)}
.rchip .rc{display:block;font-size:13px;margin-top:2px}
.rchip .st{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}
.rchip.done{border-color:var(--pos)} .rchip.done .st{color:var(--pos)}
.rchip.live{border-color:var(--gold);border-width:2px;padding:6px 1px 5px} .rchip.live .st{color:var(--gold)}
.rchip.sel{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.rchip.sel .st{color:inherit;opacity:.85}

/* leaderboard */
.board{background:var(--board);color:var(--on-board);border-radius:16px;padding:16px 16px 10px;margin-bottom:14px}
.board h2{margin:0;font:700 26px/1.05 var(--num);letter-spacing:.01em}
.board .stat{margin:3px 0 12px;font-size:15px;color:var(--on-board-muted)}

.brow{display:grid;grid-template-columns:32px minmax(0,1fr) auto;column-gap:10px;row-gap:6px;align-items:center;padding:12px 0 13px;border-top:1px solid var(--board-line)}
.brow:first-of-type{border-top:0}
.rk{font:700 24px/1 var(--num);color:var(--on-board-muted);text-align:left}
.brow.lead .rk{color:var(--sand)}
.nm{font-weight:600;font-size:20px;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb{font-size:13.5px;color:var(--on-board-muted);margin-top:1px}
.tt{font:700 46px/0.9 var(--num);text-align:right;min-width:64px}
.tt.pos{color:var(--pos-b)} .tt.neg{color:var(--neg-b)}
.bar{grid-column:2 / 4;position:relative;height:10px;border-radius:3px;background:rgba(255,255,255,.09)}
.bar::after{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;width:2px;background:var(--on-board);opacity:.75}
.bar i{position:absolute;top:0;bottom:0;display:block}
.bar i.pos{left:50%;background:var(--pos-b);border-radius:0 3px 3px 0}
.bar i.neg{right:50%;background:var(--neg-b);border-radius:3px 0 0 3px}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .35s ease}}
.boardfoot{display:flex;gap:8px;padding:12px 0 6px;border-top:1px solid var(--board-line);flex-wrap:wrap}
.btn.ondark{background:transparent;color:var(--on-board);border-color:rgba(255,255,255,.35)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:8px}
table{border-collapse:collapse;width:100%;min-width:540px}
th{font-weight:500;font-size:13px;color:var(--muted);text-align:center;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);padding-left:12px;font-weight:600;white-space:nowrap;box-shadow:1px 0 0 var(--line)}
.cd{font:700 22px/1 var(--num)}
.cd.pos{color:var(--pos)} .cd.neg{color:var(--neg)}
.cs{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap}
td.win .cd::after{content:"";display:block;height:3px;background:var(--gold);border-radius:2px;margin:3px auto 0;width:22px}
td.livecell .cd{font-style:italic;opacity:.9}
.tc{font:600 18px/1 var(--num)}
.note{font-size:14px;color:var(--muted);margin:2px 2px 16px}

/* panels & form bits */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 14px}
.panel h2{margin:0;font:700 24px/1.1 var(--num);letter-spacing:.01em}
.panel h3{margin:0;font:700 22px/1 var(--num)}
.panel p{margin:4px 0 0}
.rhead{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:9px 14px;font-weight:600;font-size:16px;min-height:44px}
.btn.primary{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.btn.sm{min-height:38px;padding:6px 12px;font-size:15px}
.btn.danger{color:var(--neg);border-color:var(--neg)}
.btn[disabled]{opacity:.45;cursor:default}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.pcard{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--bg)}
.pcard .pn{font-weight:600;line-height:1.1}
.pcard .pv{font:700 30px/1.05 var(--num);margin-top:2px}
.pcard .pv.pos{color:var(--pos)} .pcard .pv.neg{color:var(--neg)}
.pcard .ps{font-size:13px;color:var(--muted);line-height:1.3}
.tag{display:inline-block;font-size:11.5px;border:1px solid var(--line);border-radius:999px;padding:0 6px;margin-left:5px;color:var(--muted);vertical-align:1px}
.modes{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:12px}
.modes button{flex:1;border:0;background:transparent;padding:9px 6px;font-weight:600;font-size:15px;min-height:42px}
.modes button+button{border-left:1px solid var(--line)}
.modes button[aria-pressed="true"]{background:var(--sel-bg);color:var(--sel-ink)}
.holes{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;position:relative;scrollbar-width:thin}
.pill{flex:0 0 auto;width:36px;height:36px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font:600 16px/1 var(--num)}
.pill.part{border-color:var(--ink)}
.pill.done{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.pill.cur{box-shadow:0 0 0 3px var(--gold)}
.holehead{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 4px}
.prow{padding:11px 0 12px;border-top:1px solid var(--line)}
.pname{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}

.pts{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.pt{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 0 5px;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}

.plusbtn{width:100%;min-height:44px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font:700 26px/1 var(--num)}

.fld span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
input[type=text],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;font-size:16px;min-height:44px}

.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.example{margin-top:10px;font-size:14.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.intro{border-color:var(--gold);border-width:2px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs button{flex:1;min-width:0;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:52px;font-size:13px;font-weight:600;position:relative}
.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--ink)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:-5px;left:24%;right:24%;height:3px;background:var(--gold);border-radius:0 0 3px 3px}

/* dialog */
.ov{position:fixed;inset:0;background:rgba(8,16,11,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0}
.dlg{background:var(--surface);color:var(--ink);width:100%;max-width:520px;max-height:90vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
@media (min-width:640px){.ov{align-items:center}.dlg{border-radius:16px}}
.dlg h2{margin:0 0 10px;font:700 24px/1.1 var(--num)}
.dact{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.qrow{display:grid;grid-template-columns:minmax(0,1fr) 88px;gap:4px 10px;align-items:center;margin-bottom:10px}
.qrow small{grid-column:1 / 3;color:var(--muted);font-size:13px;margin-top:-4px}
.err{color:var(--neg);font-size:14px;margin-top:6px}
.ok{color:var(--pos);font-size:14px;margin-top:6px}
.empty{padding:6px 0 2px;color:var(--on-board-muted)}
.parsel{display:flex;align-items:center;gap:6px;font-weight:600}
.parsel button{width:44px;height:40px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font:700 22px/1 var(--num)}
.parsel button.on{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.step{display:grid;grid-template-columns:52px minmax(0,1fr) 52px 46px 46px;gap:6px;margin-top:8px}
.step button{border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:54px}
.step .stp{font:600 30px/1 var(--num)}
.step .val{font:700 36px/1 var(--num)}
.step .val.empty{font:500 36px/1 var(--num);color:var(--muted);border-style:dashed}
.step .mini{font:700 20px/1 var(--num);color:var(--muted)}
.step .mini.on{background:var(--sel-bg);color:var(--sel-ink);border-color:var(--sel-bg)}
.step button[disabled]{opacity:.4;cursor:default}
.pill.nopar{border-style:dashed}
.prow .run{font-size:14px;color:var(--ink)}
.prow .run.dflt{color:var(--muted);font-style:italic}
table.card{min-width:0;width:100%;table-layout:fixed}
table.card th,table.card td{padding:6px 0;font-family:var(--num);font-size:18px;font-weight:600;text-align:center;border-bottom:1px solid var(--line)}
table.card thead th{font-size:14px;color:var(--muted);font-weight:500}
table.card th:first-child{width:74px;text-align:left;padding-left:10px;font-family:var(--txt);font-size:15px;font-weight:600}
table.card td.sum{background:var(--bg);font-weight:700}
table.card td.sum.part{color:var(--muted);font-style:italic}
.cardwrap{overflow-x:auto}
.cardwrap table.card{min-width:420px}
.parbtn{border:0;background:transparent;color:var(--muted);min-width:100%;min-height:34px;font:600 18px/1 var(--num)}
.mk{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;line-height:1}
.mk.b{border:1.5px solid currentColor;border-radius:50%;color:var(--pos)}
.mk.e{border:4px double currentColor;border-radius:50%;color:var(--pos)}
.mk.g{border:1.5px solid currentColor;color:var(--neg)}
.mk.d{border:4px double currentColor;color:var(--neg)}
.tblwrap table.sumtbl{min-width:420px}
.cnote{font-size:14px;color:var(--muted);margin:4px 2px 12px}
</style>
</head>

<script>
(function(){
'use strict';
const KEY='pinehurst-quota-cup-v1', NR=5, NH=18, MINUS='\u2212', VER=7, QBASE=35;
const OLD_MAP={0:0,1:1,2:2,3:4,4:6,5:6};
const P2S={6:2,4:3,2:4,1:5,0:6};
const RND=['hundredth','quarter','nearest'];
// Hole pars from each course's published scorecard (front nine, then back nine)
const COURSE_PARS={
  '4':[4,5,4,3,4,3,4,4,5, 4,3,4,5,3,4,4,5,4],
  '2':[4,4,4,4,5,3,4,5,3, 5,4,4,4,4,3,5,3,4],
  '1':[4,4,4,5,3,4,3,4,3, 4,4,3,4,4,4,4,4,5],
  '3':[4,3,4,3,4,3,4,3,4, 4,5,3,5,3,4,4,4,4],
  '10':[4,3,5,4,4,4,3,4,4, 5,3,5,4,3,4,4,3,4]
};
function courseKey(name){const m=/no\.?\s*(\d+)/i.exec(name||'');return m&&COURSE_PARS[m[1]]?m[1]:'custom';}
function parsForName(name){const k=courseKey(name);return k==='custom'?null:COURSE_PARS[k].slice();}
const FACTORS=[0,0.25,0.5,0.75,1];
const pidOf=i=>'p'+(i+1);
const $=(s,el)=>(el||document).querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd=n=>Math.round(n*100)/100;
const fq=n=>String(Math.round(n*100)/100);
const q4=n=>Math.round(n*4)/4;
// Handicap text: "10", "18.4", or a plus handicap written "+5.3" (or "-5.3"). Plus handicaps count as negative numbers.
function hcpNum(str){
  const t=String(str==null?'':str).trim();
  if(t==='') return null;
  const n=parseFloat(t.replace(/^[+\-]\s*/,''));
  if(!isFinite(n)) return null;
  return (t[0]==='+'||t[0]==='-')?-n:n;
}
const isPlus=str=>/^\s*[+\-]/.test(String(str==null?'':str));
// USGA-style course handicap: Index x (Slope/113) + (Rating - Par). With no slope/rating entered,
// slope defaults to 113 and rating defaults to par, which reduces this to the plain index.
function teeVal(str){
  const t=String(str==null?'':str).trim();
  if(t==='') return null;
  const n=parseFloat(t);
  return isFinite(n)?n:null;
}
function courseHandicap(idx,slopeStr,ratingStr,par){
  if(idx==null) return null;
  const sv=teeVal(slopeStr), rv=teeVal(ratingStr);
  const s=(sv!=null&&sv>0)?sv:113;
  const r=rv!=null?rv:par;
  return Math.round(idx*(s/113)+(r-par));
}
function coursePar(r){
  const pars=state.rounds[r].pars;
  return (pars&&pars.every(v=>v!=null))?pars.reduce((a,b)=>a+b,0):72;
}
const q2=n=>Math.round(n*100)/100;
const rhu=(x,k)=>Math.round(x*k+1e-9)/k;
function fmt(n){
  if(n==null||isNaN(n)) return '\u2013';
  const r=rnd(n), s=String(Math.abs(r));
  return r>0?'+'+s:r<0?MINUS+s:'0';
}
const cls=n=>n==null?'':rnd(n)>0?'pos':rnd(n)<0?'neg':'';

/* ---------- state ---------- */
function defaults(){
  const names=['Cody','Clay Hodge','Chris Hay','Jon Miller'];
  const courses=['Pinehurst No. 4','Pinehurst No. 2','Pinehurst No. 1','Pinehurst No. 3','Pinehurst No. 10'];
  return {
    v:VER, configured:false,
    players:names.map((n,i)=>({id:pidOf(i),name:n,hcp:'',quota:18})),
    settings:{factor:0.5,rounding:'hundredth'},
    courses,
    rounds:courses.map(c=>({mode:'holes',holes:{},totals:{},quotaOverride:{},pars:parsForName(c)||Array(NH).fill(null),legacy:{},tee:{name:'',slope:null,rating:null}}))
  };
}
function cleanPars(a){
  const o=[];
  for(let k=0;k<NH;k++){const v=a&&a[k];o.push(v===3||v===4||v===5?v:null);}
  return o;
}
function cleanHoles(h,ver){
  const o={}, leg={};
  for(let i=0;i<4;i++){
    const a=(h&&h[pidOf(i)])||[], arr=[];
    let conv=false;
    for(let k=0;k<NH;k++){
      let v=a[k];
      if(ver<4&&Number.isInteger(v)){ if(ver<2) v=OLD_MAP[v]; v=P2S[v]; if(v!=null) conv=true; }
      arr.push(Number.isInteger(v)&&v>=0&&v<=20?v:null);
    }
    if(arr.some(v=>v!==null)){o[pidOf(i)]=arr;if(conv)leg[pidOf(i)]=true;}
  }
  return {holes:o,legacy:leg};
}
function cleanNums(t,max){
  const o={};
  for(let i=0;i<4;i++){
    const v=t&&t[pidOf(i)];
    if(typeof v==='number'&&isFinite(v)) o[pidOf(i)]=Math.max(0,Math.min(max,Math.round(v)));
  }
  return o;
}
function cleanTee(t){
  const clean=v=>String(v==null?'':v).trim().slice(0,10);
  return {name:String((t&&t.name)||'').slice(0,30),slope:clean(t&&t.slope),rating:clean(t&&t.rating)};
}
function cleanQuotas(t){
  const o={};
  for(let i=0;i<4;i++){
    const v=t&&t[pidOf(i)];
    if(typeof v==='number'&&isFinite(v)) o[pidOf(i)]=Math.max(0,Math.min(60,q2(v)));
  }
  return o;
}
function normalize0(s){
  const d=defaults();
  if(!s||!Array.isArray(s.players)||s.players.length!==4||!Array.isArray(s.rounds)||s.rounds.length!==NR) throw new Error('Not a valid Quota Cup backup.');
  const st=s.settings||{};
  return {
    v:VER, configured:!!s.configured,
    players:s.players.map((p,i)=>{
      const hcp=p&&p.hcp!=null?String(p.hcp):'';
      let quota=Math.max(0,q2(+(p&&p.quota)||0));
      if((s.v||1)<5&&hcp!==''&&isFinite(+hcp)&&quota===Math.max(0,36-Math.round(+hcp))) quota=Math.max(0,QBASE-Math.round(+hcp));
      return {id:pidOf(i),name:String((p&&p.name)||d.players[i].name).slice(0,40),hcp,quota};
    }),
    settings:{factor:FACTORS.indexOf(+st.factor)>=0?+st.factor:0.5,rounding:(s.v||1)<4?'hundredth':RND.indexOf(st.rounding)>=0?st.rounding:'hundredth'},
    courses:d.courses.map((c,i)=>String((s.courses||[])[i]||c).slice(0,40)),
    rounds:s.rounds.map(r=>{
      const ver=s.v||1, ch=cleanHoles(r&&r.holes,ver), pars=cleanPars(r&&r.pars);
      if(ver<4){
        for(let k=0;k<NH;k++) if(pars[k]==null&&Object.keys(ch.holes).some(id=>ch.holes[id][k]!=null)) pars[k]=4;
      }
      let legacy=ch.legacy;
      if(ver>=4){legacy={};for(let i=0;i<4;i++){const id=pidOf(i);if(r&&r.legacy&&r.legacy[id]===true&&ch.holes[id]) legacy[id]=true;}}
      return {
        mode:r&&r.mode==='total'?'total':'holes',
        holes:ch.holes,
        totals:cleanNums(r&&r.totals,108),
        quotaOverride:cleanQuotas(r&&r.quotaOverride),
        pars,legacy,tee:cleanTee(r&&r.tee)
      };
    })
  };
}
function migratePars(out){
  out.rounds.forEach((rd,i)=>{
    const np=parsForName(out.courses[i]);
    if(!np) return;
    // keep the points on holes that were entered as points before strokes existed
    Object.keys(rd.legacy||{}).forEach(id=>{
      const arr=rd.holes[id];
      if(!arr) return;
      for(let k=0;k<NH;k++){
        const sv=arr[k];
        if(sv==null||sv===0) continue;
        const delta={6:-2,4:-1,2:0,1:1,0:2}[ptsFor(sv,rd.pars[k]||4)];
        arr[k]=Math.max(1,np[k]+delta);
      }
    });
    rd.pars=np;
  });
}
function normalize(s){
  const out=normalize0(s);
  if((s.v||1)<6) migratePars(out);
  return out;
}
function load(){
  try{const raw=localStorage.getItem(KEY); if(raw) return normalize(JSON.parse(raw));}catch(e){}
  return defaults();
}
let saveTimer=null;
function save(){

}
let state=load();
const ui={tab:state.configured?'board':'setup',round:0,hole:0,cardRound:0,cardView:'strokes'};

/* ---------- scoring engine ---------- */
function adjustQuota(q,pts){
  const raw=(pts-q)*state.settings.factor, m=state.settings.rounding;
  const k=m==='nearest'?1:m==='quarter'?4:100;
  return Math.max(0,q2(q+Math.sign(raw)*rhu(Math.abs(raw),k)));
}
function ptsFor(strokes,par){
  if(strokes==null) return null;
  if(strokes===0) return 0;
  const d=strokes-par;
  return d<=-2?6:d===-1?4:d===0?2:d===1?1:0;
}
function holeLabel(strokes,par){
  if(strokes===0) return 'Picked up';
  if(strokes===1) return 'Hole in one';
  const d=strokes-par;
  return d<=-3?'Albatross':d===-2?'Eagle':d===-1?'Birdie':d===0?'Par':d===1?'Bogey':d===2?'Double bogey':d===3?'Triple bogey':'+'+d;
}
function playerRound(r,id){
  const rd=state.rounds[r];
  const h=rd.holes[id]||[];
  let pts=0,thru=0;
  for(let i=0;i<NH;i++){if(h[i]!=null){pts+=ptsFor(h[i],rd.pars[i]||4);thru++;}}
  if(thru>0) return {pts,thru,complete:thru===NH};
  const v=rd.totals[id];
  if(v!=null) return {pts:v,thru:NH,complete:true};
  return {pts:null,thru:0,complete:false};
}
function compute(){
  return state.players.map(p=>{
    const rounds=[];
    const idx=hcpNum(p.hcp);
    let adjustSum=0, total=0, pts=0;
    for(let r=0;r<NR;r++){
      const par=coursePar(r), tee=state.rounds[r].tee||{};
      const ch=idx==null?null:courseHandicap(idx,tee.slope,tee.rating,par);
      const baseline=idx==null?(+p.quota||0):Math.max(0,QBASE-ch);
      const auto=q2(baseline+adjustSum);
      const ov=state.rounds[r].quotaOverride[p.id];
      const quota=ov!=null?ov:auto;
      const pr=playerRound(r,p.id);
      const pending=r>0&&!rounds[r-1].complete;
      let diff=null;
      if(pr.thru>0) diff=pr.complete?pr.pts-quota:pr.pts-quota*pr.thru/NH;
      rounds.push({quota,auto,overridden:ov!=null,pending,pts:pr.pts,thru:pr.thru,complete:pr.complete,diff,ch,par,tee});
      if(diff!=null) total+=diff;
      if(pr.pts!=null) pts+=pr.pts;
      if(pr.complete){
        const raw=(pr.pts-quota)*state.settings.factor, m=state.settings.rounding;
        const k=m==='nearest'?1:m==='quarter'?4:100;
        adjustSum+=Math.sign(raw)*rhu(Math.abs(raw),k);
      }
    }
    const nowIdx=rounds.findIndex(x=>!x.complete);
    return {p,rounds,total,pts,nowIdx,nowQuota:nowIdx>=0?rounds[nowIdx].quota:q};
  });
}
function rankOf(C){
  const arr=C.slice().sort((a,b)=>rnd(b.total)-rnd(a.total)||a.p.name.localeCompare(b.p.name));
  arr.forEach((x,i)=>{x.rank=(i>0&&rnd(x.total)===rnd(arr[i-1].total))?arr[i-1].rank:i+1;});
  arr.forEach(x=>{x.tied=arr.filter(y=>y.rank===x.rank).length>1;});
  return arr;
}
function roundStatus(C,r){
  if(C.every(x=>x.rounds[r].complete)) return 'done';
  if(C.some(x=>x.rounds[r].thru>0)) return 'live';
  return 'todo';
}
function currentRound(){
  const C=compute();
  for(let r=0;r<NR;r++) if(roundStatus(C,r)!=='done') return r;
  return NR-1;
}
function latestRound(){
  const C=compute();
  for(let r=NR-1;r>=0;r--) if(C.some(x=>x.rounds[r].thru>0)) return r;
  return currentRound();
}
const short=i=>(state.courses[i]||'').replace(/^pinehurst\s+/i,'')||('Course '+(i+1));
const first=n=>(String(n).trim().split(/\s+/)[0])||'Player';
function boardStatus(C){
  let last=-1;
  for(let r=0;r<NR;r++) if(C.some(x=>x.rounds[r].thru>0)) last=r;
  if(last<0) return 'No scores yet';
  return C.every(x=>x.rounds[last].complete)?'After round '+(last+1)+', '+short(last):'Round '+(last+1)+' in progress, '+short(last);
}
function standingsText(){
  const C=compute(), order=rankOf(C);
  const lines=['Pinehurst Quota Cup: '+boardStatus(C)];
  order.forEach(x=>{lines.push((x.tied?'T':'')+x.rank+'. '+x.p.name+'  '+fmt(x.total)+'  ('+x.pts+' pts)');});
  const nq=order.map(x=>first(x.p.name)+' '+fq(x.nowQuota)).join(', ');
  lines.push('Quotas '+(C.every(x=>x.nowIdx<0)?'after final round':'for round '+(Math.min.apply(null,C.map(x=>x.nowIdx<0?NR:x.nowIdx))+1))+': '+nq);
  return lines.join('\n');
}

function tripStrip(C,act,sel){

      }else if(r===x.nowIdx){

  });
  h+='</tbody></table></div>';
  h+='<p class="note">Each cell shows points minus quota, with points / quota beneath. A gold bar marks the round winner. Italic numbers are a round in progress, measured against a prorated quota.</p>';
  return h;

function strokeMark(v,par){

}
function grossOf(v,par){return v===0?(par||4)+2:v;}

  C.forEach(x=>{
    if(rd.legacy&&rd.legacy[x.p.id]) notes.push('Strokes for '+esc(first(x.p.name))+' were converted from points entered before the scorecard existed (par 4 assumed on those holes), so they are estimates.');
    if(rd.totals[x.p.id]!=null&&!(rd.holes[x.p.id]&&rd.holes[x.p.id].some(v=>v!=null))) notes.push(esc(first(x.p.name))+' has a typed total for this round, so there are no hole scores to show.');
  });
  notes.forEach(n=>{h+='<p class="cnote">'+n+'</p>';});
  h+='</section>';
  return h;
}

function teeNoteText(i,par,tee){
  if(teeVal(tee.slope)==null&&teeVal(tee.rating)==null) return 'Par '+par+'. No slope or rating yet \u2014 quotas use the plain handicap index for this round.';
  return 'Par '+par+'. '+state.players.filter(pl=>hcpNum(pl.hcp)!=null).map(pl=>esc(first(pl.name))+' '+courseHandicap(hcpNum(pl.hcp),tee.slope,tee.rating,par)).join(', ');
}
function renderSetup(){
  let h='';
  if(!state.configured){
    h+='<section class="panel intro"><h2>Set up the trip</h2><p>Enter each golfer\u2019s handicap and the starting quota fills in as '+QBASE+' minus handicap. You can also type a quota directly. For a plus handicap like +5.3, type 5.3 and tap the + button. Then start scoring.</p><div class="actions"><button class="btn primary" data-act="start">Start scoring</button></div></section>';
  }
  h+='<section class="panel"><h2>Golfers</h2><p class="muted sm" style="margin-bottom:10px">Use the course handicap for the tees you will play.</p>';
  state.players.forEach(p=>{
    h+='<div class="setrow"><label class="fld" style="grid-column:1 / -1"><span>Name</span><input type="text" data-f="name" data-p="'+p.id+'" value="'+esc(p.name)+'" maxlength="40" autocomplete="off"></label>'+
       '<label class="fld"><span>Handicap</span><input type="text" inputmode="decimal" autocomplete="off" data-f="hcp" data-p="'+p.id+'" value="'+esc(p.hcp)+'" placeholder="e.g. 12.4"></label>'+
       '<div class="fld"><span>Plus</span><button type="button" class="plusbtn" data-act="plus" data-p="'+p.id+'" aria-pressed="'+isPlus(p.hcp)+'" aria-label="Plus handicap for '+esc(p.name)+'">+</button></div>'+
       '<label class="fld"><span>Start quota</span><input type="number" step="0.01" min="0" inputmode="decimal" data-f="quota" data-p="'+p.id+'" value="'+p.quota+'"></label></div>';
  });
  h+='</section>';
  h+='<section class="panel"><h2>Quota adjustment</h2><p class="muted sm">After each round, every golfer\u2019s quota moves toward what they actually scored. Quotas carry two decimals, like 26.88.</p><div class="two">'+
     '<label class="fld"><span>Move quota by</span><select data-f="factor">'+FACTORS.map(f=>'<option value="'+f+'"'+(f===state.settings.factor?' selected':'')+'>'+(f===0?'0% (never)':Math.round(f*100)+'% of the gap'+(f===0.5?' (half)':''))+'</option>').join('')+'</select></label>'+
     '<label class="fld"><span>Rounding</span><select data-f="rounding"><option value="hundredth"'+(state.settings.rounding==='hundredth'?' selected':'')+'>Two decimals</option><option value="quarter"'+(state.settings.rounding==='quarter'?' selected':'')+'>Nearest 0.25</option><option value="nearest"'+(state.settings.rounding==='nearest'?' selected':'')+'>Whole points</option></select></label></div>'+
     '<p class="example" id="example">'+exampleText()+'</p></section>';
  h+='<section class="panel"><h2>Courses and tees</h2><p class="muted sm">Pars load automatically for each Pinehurst course. Add the tee\u2019s Slope and Course Rating the day you play, and quotas adjust for that tee\u2019s difficulty.</p><div style="margin-top:10px">'+state.courses.map((c,i)=>{
    const k=courseKey(c), tee=state.rounds[i].tee||{}, par=coursePar(i);
    return '<div class="teerow"><div class="fld"><span>Round '+(i+1)+'</span><select data-f="coursepick" data-i="'+i+'" aria-label="Course for round '+(i+1)+'">'+['4','2','1','3','10'].map(n=>'<option value="'+n+'"'+(k===n?' selected':'')+'>Pinehurst No. '+n+'</option>').join('')+'<option value="custom"'+(k==='custom'?' selected':'')+'>Other course</option></select></div>'+
      (k==='custom'?'<label class="fld"><span>Course name</span><input type="text" data-f="course" data-i="'+i+'" value="'+esc(c)+'" maxlength="40" placeholder="Course name"></label>':'')+
      '<div class="teegrid"><label class="fld"><span>Tee name</span><input type="text" data-f="teename" data-i="'+i+'" value="'+esc(tee.name||'')+'" maxlength="30" placeholder="e.g. Blue"></label>'+
      '<label class="fld"><span>Slope</span><input type="text" inputmode="decimal" autocomplete="off" data-f="slope" data-i="'+i+'" value="'+esc(tee.slope||'')+'" placeholder="e.g. 135"></label>'+
      '<label class="fld"><span>Rating</span><input type="text" inputmode="decimal" autocomplete="off" data-f="rating" data-i="'+i+'" value="'+esc(tee.rating||'')+'" placeholder="e.g. 73.7"></label></div>'+
      '<p class="cnote" id="teenote-'+i+'" style="margin:2px 0 0">'+teeNoteText(i,par,tee)+'</p>'+
    '</div>';
  }).join('')+'</div></section>';
  h+='<section class="panel"><h2>How points work</h2><p>Enter strokes on each hole after setting its par. Gross Stableford points follow from that: double bogey or worse 0, bogey 1, par 2, birdie 4, eagle or better 6. Your points for the round minus your quota is your score. The leaderboard adds those up across all five rounds.</p><p>Each round\u2019s quota starts from a course handicap: index \u00d7 (Slope \u00f7 113) + (Rating \u2212 par), rounded to a whole number. Add a tee\u2019s Slope and Rating above and this happens automatically; leave them blank and it falls back to 35 minus the plain index.</p></section>';
  h+='<section class="panel"><h2>Save and reset</h2><p class="muted sm">Scores are saved in this browser on this device. Export a backup to move them to another phone.</p><div class="actions"><button class="btn sm" data-act="export">Export backup</button><button class="btn sm" data-act="import">Import backup</button><button class="btn sm danger" data-act="clear">Clear all scores</button></div></section>';
  return h;
}
function exampleText(){
  return 'Quota 20, scored 27 ('+fmt(7)+'): next quota '+fq(adjustQuota(20,27))+'. Quota 20, scored 15 ('+fmt(-5)+'): next quota '+fq(adjustQuota(20,15))+'. Quota 20.25, scored 25: next quota '+fq(adjustQuota(20.25,25))+'.';
}

let refocus=null;
function render(){
  const C=compute();
  $('#view').innerHTML=ui.tab==='board'?renderBoard(C):ui.tab==='score'?renderScore(C):ui.tab==='card'?renderCard(C):renderSetup();
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-current',b.dataset.tab===ui.tab?'page':'false'));
  if(ui.tab==='score'){
    const c=$('.holes'), cur=$('.pill.cur');
    if(c&&cur) c.scrollLeft=cur.offsetLeft-c.clientWidth/2+cur.clientWidth/2;
  }
  if(refocus){const el=$(refocus);if(el)el.focus({preventScroll:true});refocus=null;}
}

/* ---------- dialogs ---------- */
let modalEl=null, modalOpener=null;
function closeModal(){
  if(modalEl){modalEl.remove();modalEl=null;}
  if(modalOpener&&document.contains(modalOpener)) modalOpener.focus({preventScroll:true});
  modalOpener=null;
}
function openModal(o){
  closeModal();
  modalOpener=document.activeElement;
  const ov=document.createElement('div');
  ov.className='ov';
  ov.innerHTML='<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgt"><h2 id="dlgt">'+esc(o.title)+'</h2><div class="dbody">'+o.body+'</div><div class="dact"></div></div>';
  const act=$('.dact',ov);
  o.actions.forEach(a=>{
    const b=document.createElement('button');
    b.className='btn'+(a.kind?' '+a.kind:'');
    b.textContent=a.label;
    b.addEventListener('click',()=>{const keep=a.onClick?a.onClick(ov):false;if(keep!==true)closeModal();});
    act.appendChild(b);
  });
  ov.addEventListener('click',e=>{if(e.target===ov)closeModal();});
  document.body.appendChild(ov);
  modalEl=ov;
  const f=$('input,textarea',ov)||$('.dact button',ov);
  if(f) f.focus({preventScroll:true});
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modalEl)closeModal();});

function copyText(text,statEl){
  const fallback=()=>{
    const ta=$('textarea',modalEl);
    try{ta.focus();ta.select();const ok=document.execCommand('copy');statEl.className=ok?'ok':'err';statEl.textContent=ok?'Copied.':'Text selected. Press and hold to copy.';}
    catch(e){statEl.className='err';statEl.textContent='Text selected. Press and hold to copy.';}
  };
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(()=>{statEl.className='ok';statEl.textContent='Copied.';},fallback);
  }else fallback();
}
function textDialog(title,text,readonly){
  openModal({title,body:'<textarea id="dtext" '+(readonly?'readonly ':'')+'spellcheck="false" aria-label="'+esc(title)+'">'+esc(text)+'</textarea><div id="dstat" aria-live="polite"></div>',
    actions:[{label:'Copy',kind:'primary',onClick:()=>{copyText($('#dtext').value,$('#dstat'));return true;}},{label:'Close'}]});
  const ta=$('#dtext');ta.focus();ta.select();
}

/* ---------- actions ---------- */
function setStrokes(id,h,v){
  const rd=state.rounds[ui.round];
  if(rd.pars[h]==null) return;
  const arr=rd.holes[id]||(rd.holes[id]=Array(NH).fill(null));
  arr[h]=v;
  if(arr.every(x=>x==null)) delete rd.holes[id];
  delete rd.totals[id];
  state.configured=true;
}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(!t||t.disabled) return;
  const a=t.dataset.act;
  if(a==='tab'){ui.tab=t.dataset.tab;if(ui.tab==='score'){ui.round=currentRound();ui.hole=firstOpenHole(ui.round);}if(ui.tab==='card')ui.cardRound=latestRound();render();window.scrollTo(0,0);}
  else if(a==='round'){ui.round=+t.dataset.r;ui.tab='score';ui.hole=firstOpenHole(ui.round);render();window.scrollTo(0,0);}
  else if(a==='mode'){state.rounds[ui.round].mode=t.dataset.v;save();render();}
  else if(a==='hole'){ui.hole=+t.dataset.h;render();}
  else if(a==='prev'){ui.hole=Math.max(0,ui.hole-1);render();}
  else if(a==='next'||a==='finish'){
    const rd=state.rounds[ui.round], par=rd.pars[ui.hole];
    if(par!=null){
      state.players.forEach(pl=>{if((rd.holes[pl.id]||[])[ui.hole]==null) setStrokes(pl.id,ui.hole,par);});
      save();
    }
    if(a==='finish'){ui.tab='board';render();window.scrollTo(0,0);}
    else{ui.hole=Math.min(NH-1,ui.hole+1);render();}
  }
  else if(a==='par'){state.rounds[ui.round].pars[ui.hole]=+t.dataset.v;save();render();}
  else if(a==='mid'||a==='inc'||a==='dec'||a==='pickup'||a==='clr'){
    const rd=state.rounds[ui.round], par=rd.pars[ui.hole], id=t.dataset.p;
    if(par==null) return;
    const cur=(rd.holes[id]||[])[ui.hole];
    let nv;
    if(a==='mid') nv=par;
    else if(a==='pickup') nv=cur===0?null:0;
    else if(a==='clr') nv=null;
    else{
      const dir=a==='inc'?1:-1;
      if(cur==null) nv=Math.max(1,par+dir);
      else if(cur===0) nv=par+2;
      else nv=Math.max(1,Math.min(20,cur+dir));
    }
    setStrokes(id,ui.hole,nv);save();
    refocus='[data-act="'+a+'"][data-p="'+id+'"]';
    render();
  }
  else if(a==='plus'){
    const p=state.players.find(x=>x.id===t.dataset.p), inp=$('[data-f="hcp"][data-p="'+p.id+'"]');
    const v=String(inp.value||'').trim();
    inp.value=isPlus(v)?v.replace(/^[+\-]\s*/,''):'+'+v;
    setHcp(p,inp.value);
  }
  else if(a==='cardround'){ui.cardRound=+t.dataset.r;render();window.scrollTo(0,0);}
  else if(a==='cardview'){ui.cardView=t.dataset.v;render();}
  else if(a==='cardpar'){
    const rd=state.rounds[+t.dataset.r], k=+t.dataset.h, pr=rd.pars[k];
    rd.pars[k]=pr==null?4:pr===4?5:pr===5?3:4;save();
    refocus='[data-act="cardpar"][data-h="'+k+'"]';render();
  }
  else if(a==='start'){state.configured=true;save();ui.tab='score';ui.round=0;ui.hole=0;render();window.scrollTo(0,0);}
  else if(a==='share'){textDialog('Share standings',standingsText(),false);}
  else if(a==='export'){textDialog('Backup',JSON.stringify(state),true);}
  else if(a==='import'){
    openModal({title:'Import backup',body:'<p class="muted sm" style="margin:0 0 8px">Paste a backup exported from this tracker. It replaces everything on this device.</p><textarea id="itext" spellcheck="false" aria-label="Backup text"></textarea><div id="istat" class="err" aria-live="polite"></div>',
      actions:[{label:'Load backup',kind:'primary',onClick:()=>{
        try{state=normalize(JSON.parse($('#itext').value));save();ui.tab='board';ui.round=currentRound();ui.hole=0;render();return false;}
        catch(err){$('#istat').textContent='That text is not a valid backup.';return true;}
      }},{label:'Cancel'}]});
  }
  else if(a==='clear'){
    openModal({title:'Clear all scores?',body:'<p>This removes every score and quota override for all five rounds. Golfers, starting quotas, courses, and the pars you set stay.</p>',
      actions:[{label:'Clear scores',kind:'danger',onClick:()=>{state.rounds=defaults().rounds.map((d,i)=>{d.pars=state.rounds[i].pars.slice();return d;});save();ui.round=0;ui.hole=0;render();return false;}},{label:'Cancel'}]});
  }
  else if(a==='quotas'){
    const C=compute(), r=ui.round;
    let body='<p class="muted sm" style="margin:0 0 10px">Quotas adjust automatically after each finished round. Change one here to override it for this round; later rounds adjust from your number.</p>';
    C.forEach(x=>{
      const q=x.rounds[r];
      body+='<div class="qrow"><label for="q-'+x.p.id+'">'+esc(x.p.name)+'</label><input id="q-'+x.p.id+'" type="number" min="0" step="0.01" inputmode="decimal" data-auto="'+q.auto+'" data-p="'+x.p.id+'" value="'+q.quota+'"><small>Automatic quota: '+fq(q.auto)+(q.pending?' (held until the previous round is finished)':'')+'</small></div>';
    });
    openModal({title:'Round '+(r+1)+' quotas',body,actions:[{label:'Save quotas',kind:'primary',onClick:ov=>{
      ov.querySelectorAll('input[data-p]').forEach(inp=>{
        const id=inp.dataset.p, v=q2(+inp.value), auto=+inp.dataset.auto;
        if(inp.value===''||isNaN(v)||v===auto) delete state.rounds[r].quotaOverride[id];
        else state.rounds[r].quotaOverride[id]=Math.max(0,Math.min(60,v));
      });
      save();render();return false;
    }},{label:'Cancel'}]});
  }
});
function setHcp(p,val){
  p.hcp=val;
  const h=hcpNum(val);
  if(h!=null){
    p.quota=Math.max(0,QBASE-Math.round(h));
    const qi=$('[data-f="quota"][data-p="'+p.id+'"]');if(qi)qi.value=p.quota;
  }
  const pb=$('.plusbtn[data-p="'+p.id+'"]');if(pb)pb.setAttribute('aria-pressed',String(isPlus(val)));
  save();
}
document.addEventListener('input',e=>{
  const t=e.target, f=t.dataset&&t.dataset.f;
  if(!f) return;
  if(f==='name'){state.players.find(p=>p.id===t.dataset.p).name=t.value;save();}
  else if(f==='hcp'){
    const p=state.players.find(p=>p.id===t.dataset.p);
    setHcp(p,t.value);
  }
  else if(f==='quota'){
    const p=state.players.find(p=>p.id===t.dataset.p);
    p.quota=t.value===''?0:Math.max(0,q2(+t.value)||0);save();
  }
  else if(f==='course'){state.courses[+t.dataset.i]=t.value;save();}
  else if(f==='teename'){state.rounds[+t.dataset.i].tee.name=t.value;save();}
  else if(f==='slope'||f==='rating'){
    const i=+t.dataset.i, rd=state.rounds[i];
    rd.tee[f]=t.value;
    save();
    const note=$('#teenote-'+i);
    if(note) note.innerHTML=teeNoteText(i,coursePar(i),rd.tee);
  }
  else if(f==='total'){
    const r=ui.round, id=t.dataset.p, rd=state.rounds[r];
    if(t.value===''||!isFinite(+t.value)) delete rd.totals[id];
    else rd.totals[id]=Math.max(0,Math.min(108,Math.round(+t.value)));
    if(Object.keys(rd.totals).length) state.configured=true;
    save();
    const C=compute();
    C.forEach(x=>{const el=$('#res-'+x.p.id);if(el)el.innerHTML=resHTML(x,r);});
    // update summary cards without touching the inputs
    const cards=document.querySelectorAll('.pcard');
    C.forEach((x,i)=>{
      const q=x.rounds[r];
      if(cards[i]){
        cards[i].querySelector('.pv').className='pv num '+cls(q.diff);
        cards[i].querySelector('.pv').textContent=fmt(q.diff);
        cards[i].querySelectorAll('.ps')[0].textContent=q.thru?q.pts+' pts, thru '+q.thru:'no score yet';
      }
    });
  }
});
document.addEventListener('change',e=>{
  const t=e.target, f=t.dataset&&t.dataset.f;
  if(f==='factor'){state.settings.factor=+t.value;save();const ex=$('#example');if(ex)ex.textContent=exampleText();}
  else if(f==='rounding'){state.settings.rounding=t.value;save();const ex=$('#example');if(ex)ex.textContent=exampleText();}
  else if(f==='coursepick'){
    const i=+t.dataset.i, v=t.value;
    if(v==='custom'){
      if(courseKey(state.courses[i])!=='custom'){state.courses[i]='Other course';state.rounds[i].pars=Array(NH).fill(null);}
    }else{
      state.courses[i]='Pinehurst No. '+v;state.rounds[i].pars=COURSE_PARS[v].slice();
    }
    save();render();
  }
});

ui.round=currentRound();
ui.hole=firstOpenHole(ui.round);
ui.cardRound=latestRound();
render();
})();
</script>
</body>
</html>
